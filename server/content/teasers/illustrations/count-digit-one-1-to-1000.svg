<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><title>A long ribbon of numbers from 1 to 1000 under a magnifying glass hunting for ones</title><g fill="none" stroke="#17263e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 60 H300 V110 H20 Z" fill="#fffdf6"/><text x="160" y="92" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#4a5870" stroke="none">1 2 3 … 99 100 … 999 1000</text><circle cx="220" cy="120" r="30" fill="#e5eafb" fill-opacity="0.5" stroke="#2b54d4" stroke-width="3"/><path d="M242 142 L270 168" stroke-width="6"/><text x="220" y="128" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#b3403a" stroke="none">1</text></g></svg>