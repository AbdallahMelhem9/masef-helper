<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><title>Three boxes a, a+k and a+2k multiplied together, claimed to equal a prime</title><g stroke="#17263e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="20" y="62" width="70" height="50" rx="8" fill="#e5eafb"/><text x="55" y="93" font-size="16" fill="#17263e" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600">a</text><text x="100" y="94" font-size="18" fill="#4a5870" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">×</text><rect x="110" y="62" width="70" height="50" rx="8" fill="#e6f2ea"/><text x="145" y="93" font-size="16" fill="#17263e" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600">a+k</text><text x="190" y="94" font-size="18" fill="#4a5870" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">×</text><rect x="200" y="62" width="70" height="50" rx="8" fill="#f7ecce"/><text x="235" y="93" font-size="16" fill="#17263e" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600">a+2k</text><path d="M40 130 Q100 150 160 130 Q220 150 280 130" stroke="#4a5870" stroke-dasharray="4 5"/><text x="160" y="40" font-size="16" fill="#b3403a" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600">= prime</text><circle cx="290" cy="36" r="12" fill="#f7ecce"/><circle cx="285.8" cy="34.2" r="1.7" fill="#17263e" stroke="none"/><circle cx="294.2" cy="34.2" r="1.7" fill="#17263e" stroke="none"/><ellipse cx="290" cy="41.4" rx="2.2" ry="2.8" fill="#fffdf6" stroke-width="1.4"/></g></svg>