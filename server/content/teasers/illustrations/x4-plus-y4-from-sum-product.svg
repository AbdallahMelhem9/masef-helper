<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><title>Two blocks x and y with their sum 10 and product 20, next to a card asking for x to the fourth plus y to the fourth</title><g stroke="#17263e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="40" y="60" width="70" height="70" rx="6" fill="#e5eafb"/><text x="75" y="104" font-size="30" fill="#2b54d4" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600">x</text><rect x="130" y="60" width="70" height="70" rx="6" fill="#e6f2ea"/><text x="165" y="104" font-size="30" fill="#3f8f5f" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600">y</text><text x="120" y="38" font-size="14" fill="#17263e" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">x + y = 10</text><text x="120" y="160" font-size="14" fill="#17263e" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">xy = 20</text><rect x="226" y="46" width="72" height="92" rx="8" fill="#f7ecce"/><text x="262" y="88" font-size="15" fill="#17263e" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600">x⁴+y⁴</text><text x="262" y="118" font-size="22" fill="#b3403a" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600">?</text></g></svg>