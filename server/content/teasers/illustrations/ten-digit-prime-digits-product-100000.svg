<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><title>Ten empty digit slots waiting to be filled so that their product is one hundred thousand</title><g fill="none" stroke="#17263e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="70" width="26" height="36" rx="4" fill="#fffdf6"/><rect x="42" y="70" width="26" height="36" rx="4" fill="#e5eafb"/><rect x="72" y="70" width="26" height="36" rx="4" fill="#fffdf6"/><rect x="102" y="70" width="26" height="36" rx="4" fill="#fffdf6"/><rect x="132" y="70" width="26" height="36" rx="4" fill="#f7ecce"/><rect x="162" y="70" width="26" height="36" rx="4" fill="#fffdf6"/><rect x="192" y="70" width="26" height="36" rx="4" fill="#fffdf6"/><rect x="222" y="70" width="26" height="36" rx="4" fill="#e5eafb"/><rect x="252" y="70" width="26" height="36" rx="4" fill="#fffdf6"/><rect x="282" y="70" width="26" height="36" rx="4" fill="#fffdf6"/><text x="160" y="146" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#17263e" stroke="none">∏ = 100000</text><path d="M40 40 q10 -14 20 0 M260 40 q10 -14 20 0" stroke="#d9a621"/></g></svg>