<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><title>A narrow bell curve plus a medium bell curve equals a wide bell curve, with volatilities 4, 7 and 11</title><g fill="none" stroke="#17263e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M26 120 C38 120 42 60 50 60 C58 60 62 120 74 120 Z" fill="#e5eafb"/><path d="M87 120 C106 120 112.3 74 125 74 C137.7 74 144 120 163 120 Z" fill="#e6f2ea"/><path d="M187 120 C216 120 225.7 86 245 86 C264.3 86 274 120 303 120 Z" fill="#f7ecce"/><text x="88" y="100" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="600" fill="#17263e" stroke="none" text-anchor="middle">+</text><text x="180" y="100" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="600" fill="#17263e" stroke="none" text-anchor="middle">=</text><text x="50" y="146" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#17263e" stroke="none" text-anchor="middle">σ 4</text><text x="125" y="146" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#17263e" stroke="none" text-anchor="middle">σ 7</text><text x="245" y="146" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#17263e" stroke="none" text-anchor="middle">σ 11</text><text x="160" y="36" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#d9a621" stroke="none" text-anchor="middle">ρ ?</text></g></svg>