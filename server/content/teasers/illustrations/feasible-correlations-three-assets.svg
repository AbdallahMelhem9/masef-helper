<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><title>Three assets A, B and C joined in a triangle of tight ropes, with a question mark over the A to C link</title><g stroke="#17263e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M60 140 L160 40" stroke="#3f8f5f" stroke-width="4"/>
<path d="M160 40 L260 140" stroke="#3f8f5f" stroke-width="3.2"/>
<path d="M60 140 L260 140" stroke="#b3403a" stroke-width="2" stroke-dasharray="3 7"/>
<circle cx="60" cy="140" r="22" fill="#e5eafb"/><text x="60" y="146" font-size="16" fill="#17263e" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">A</text>
<circle cx="160" cy="40" r="22" fill="#f7ecce"/><text x="160" y="46" font-size="16" fill="#17263e" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">B</text>
<circle cx="260" cy="140" r="22" fill="#e6f2ea"/><text x="260" y="146" font-size="16" fill="#17263e" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">C</text>
<circle cx="160" cy="140" r="13" fill="#f9e9e8"/><text x="160" y="145" font-size="15" fill="#b3403a" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">?</text>
</g></svg>
