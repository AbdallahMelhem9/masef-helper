<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><title>A weighted die compared with the sum of two rolls of the same die</title><g stroke="#17263e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><g><rect x="40" y="64" width="52" height="52" rx="10.4" fill="#f7ecce"/><circle cx="66" cy="90" r="4.2" fill="#17263e" stroke="none"/></g><rect x="80" y="112" width="20" height="14" rx="3" fill="#4a5870"/><text x="136" y="102" font-size="30" font-weight="700" fill="#b3403a" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">≟</text><g transform="rotate(-10 196 84)"><rect x="174" y="62" width="44" height="44" rx="8.8" fill="#f7ecce"/><circle cx="196" cy="84" r="3.5" fill="#17263e" stroke="none"/></g><text x="234" y="96" font-size="22" font-weight="700" fill="#17263e" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">+</text><g transform="rotate(10 270 90)"><rect x="248" y="68" width="44" height="44" rx="8.8" fill="#f7ecce"/><circle cx="270" cy="90" r="3.5" fill="#17263e" stroke="none"/></g><text x="66" y="150" font-size="12" font-weight="400" fill="#4a5870" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">one roll</text><text x="234" y="150" font-size="12" font-weight="400" fill="#4a5870" stroke="none" text-anchor="middle" font-family="IBM Plex Sans, sans-serif">sum of two</text></g></svg>