<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><title>A unit square with a randomly sized rectangle drawn from its corner, and two dice deciding the side lengths</title><g fill="none" stroke="#17263e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="20" width="140" height="140" fill="#fffdf6" stroke="#4a5870" stroke-dasharray="5 4"/><rect x="40" y="62" width="96" height="98" fill="#e5eafb"/><text x="88" y="176" font-size="13" fill="#2b54d4" stroke="none" text-anchor="middle" font-weight="600" font-family="IBM Plex Sans, sans-serif">X</text><text x="28" y="116" font-size="13" fill="#2b54d4" stroke="none" text-anchor="middle" font-weight="600" font-family="IBM Plex Sans, sans-serif">Y</text><text x="186" y="30" font-size="12" fill="#4a5870" stroke="none" text-anchor="middle" font-weight="600" font-family="IBM Plex Sans, sans-serif">1</text><text x="88" y="118" font-size="14" fill="#17263e" stroke="none" text-anchor="middle" font-weight="500" font-family="IBM Plex Sans, sans-serif">area?</text><rect x="220" y="40" width="40" height="40" rx="7" fill="#f7ecce" transform="rotate(-12 240 60)"/><circle cx="232" cy="52" r="3" fill="#17263e" stroke="none"/><circle cx="248" cy="68" r="3" fill="#17263e" stroke="none"/><rect x="248" y="100" width="40" height="40" rx="7" fill="#f9e9e8" transform="rotate(14 268 120)"/><circle cx="268" cy="120" r="3" fill="#17263e" stroke="none"/><circle cx="258" cy="110" r="3" fill="#17263e" stroke="none"/><circle cx="278" cy="130" r="3" fill="#17263e" stroke="none"/></g></svg>