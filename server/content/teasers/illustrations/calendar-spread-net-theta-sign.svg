<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><title>A 30-day calendar marked sell and a 60-day calendar marked buy, with an hourglass running between them</title><g fill="none" stroke="#17263e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="50" width="80" height="80" rx="6" fill="#fffdf6"/><rect x="30" y="50" width="80" height="18" rx="6" fill="#f9e9e8"/><path d="M44 44 V58 M96 44 V58"/><text x="70.0" y="110.0" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="700" fill="#17263e" text-anchor="middle" stroke="none">30</text><rect x="210" y="40" width="90" height="90" rx="6" fill="#fffdf6"/><rect x="210" y="40" width="90" height="18" rx="6" fill="#e6f2ea"/><path d="M224 34 V48 M286 34 V48"/><text x="255.0" y="105.0" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="700" fill="#17263e" text-anchor="middle" stroke="none">60</text><path d="M140 50 H180 L166 90 L180 130 H140 L154 90 Z" fill="#f7ecce"/><path d="M148 124 H172 L160 104 Z" fill="#d9a621"/><text x="70" y="160" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#b3403a" text-anchor="middle" stroke="none">sell</text><text x="255" y="160" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#3f8f5f" text-anchor="middle" stroke="none">buy</text></g></svg>