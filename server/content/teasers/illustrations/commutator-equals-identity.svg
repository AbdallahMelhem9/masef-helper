<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><title>Two matrix blocks A and B swapping places, with a question whether AB minus BA can equal the identity</title><g fill="none" stroke="#17263e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="40" width="70" height="70" rx="6" fill="#e5eafb"/><rect x="120" y="40" width="70" height="70" rx="6" fill="#f7ecce"/><text x="65" y="88" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#2b54d4" stroke="none">A</text><text x="155" y="88" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#d9a621" stroke="none">B</text><path d="M60 124 q50 36 100 0" stroke="#b3403a"/><path d="M150 122 l10 2 l-2 10" stroke="#b3403a"/><path d="M160 30 q-50 -30 -100 0" stroke="#b3403a"/><path d="M70 22 l-10 8 l10 4" stroke="#b3403a"/><rect x="220" y="40" width="70" height="70" rx="6" fill="#ffffff"/><text x="240" y="64" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17263e" stroke="none">1</text><text x="270" y="64" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4a5870" stroke="none">0</text><text x="240" y="98" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4a5870" stroke="none">0</text><text x="270" y="98" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17263e" stroke="none">1</text><text x="205" y="82" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17263e" stroke="none">=</text><text x="255" y="150" font-family="IBM Plex Sans, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#b3403a" stroke="none">?</text></g></svg>